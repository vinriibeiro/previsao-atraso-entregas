name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar o projeto
        # requirements.txt fixa as versões com que o modelo salvo foi treinado
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests app
      - name: Testes
        run: pytest -q
